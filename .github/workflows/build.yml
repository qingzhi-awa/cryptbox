name: Build CryPtBox

# Tauri 2 客户端跨平台构建：Windows (NSIS + MSI) + macOS (dmg) + Linux (deb)
# 触发：push main / PR / 打 tag v* / 手动
# 打 tag v* 时自动创建 GitHub Release 并附全部产物

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # 移除本地 signtool 签名命令（CI 无证书），否则 tauri build 会因签名失败
      - name: Remove local signCommand for CI
        shell: pwsh
        run: |
          $p = "src-tauri/tauri.conf.json"
          $c = Get-Content $p -Raw | ConvertFrom-Json
          $c.bundle.windows.PSObject.Properties.Remove("signCommand")
          $c | ConvertTo-Json -Depth 30 | Set-Content $p -Encoding UTF8

      - run: npm install
      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: CryPtBox-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [ aarch64-apple-darwin, x86_64-apple-darwin ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm install
      - run: npx tauri build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: CryPtBox-macos-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install
      - run: npx tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: CryPtBox-linux-x64
          path: src-tauri/target/release/bundle/deb/*.deb

  build-linux-arm64:
    name: Linux (arm64，统信 UOS / 银河麒麟)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm install
      - run: npx tauri build --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: CryPtBox-linux-arm64
          path: src-tauri/target/release/bundle/deb/*.deb

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-macos, build-linux, build-linux-arm64 ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
