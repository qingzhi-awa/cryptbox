name: Build CryPtBox Clients

# 双端客户端构建：Windows (wails) + macOS (wails universal -> dmg/zip)
# 触发：push main / PR / 打 tag v* / 手动
# 打 tag v* 时自动创建 GitHub Release 并附全部产物

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  WAILS_VERSION: v2.15.0

jobs:
  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: wails build -platform windows/amd64 -ldflags "-s -w"

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer (setup.exe)
        shell: pwsh
        run: |
          $c = Get-Content installer.nsi -Raw -Encoding UTF8
          [System.IO.File]::WriteAllText("$PWD\installer.nsi", $c, (New-Object System.Text.UTF8Encoding $true))
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer.nsi

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force CryPtBox-portable | Out-Null
          Copy-Item build/bin/CryPtBox.exe CryPtBox-portable/
          Copy-Item build/import-template.csv "CryPtBox-portable/密匣 - 导入模板.csv"
          New-Item -ItemType File -Force "CryPtBox-portable/portable.flag" | Out-Null
          Compress-Archive -Path CryPtBox-portable -DestinationPath CryPtBox-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: CryPtBox-windows
          path: |
            CryPtBox-setup.exe
            CryPtBox-portable.zip

  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: "Build (darwin universal: amd64 + arm64)"
        run: wails build -platform darwin/universal -ldflags "-s -w"

      - name: Package DMG and ZIP
        run: |
          hdiutil create -volname CryPtBox -srcfolder build/bin/CryPtBox.app -ov -format UDZO CryPtBox-macos.dmg
          ditto -c -k --keepParent build/bin/CryPtBox.app CryPtBox-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CryPtBox-macos
          path: |
            CryPtBox-macos.dmg
            CryPtBox-macos.zip

  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK / WebKit2GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev gcc pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        run: wails build -platform linux/amd64 -ldflags "-s -w"

      - name: Package
        run: |
          mkdir -p CryPtBox-linux-amd64
          cp build/bin/CryPtBox CryPtBox-linux-amd64/
          cp build/import-template.csv "CryPtBox-linux-amd64/密匣 - 导入模板.csv"
          chmod +x CryPtBox-linux-amd64/CryPtBox
          tar -czf CryPtBox-linux-amd64.tar.gz CryPtBox-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: CryPtBox-linux-amd64
          path: CryPtBox-linux-amd64.tar.gz

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-windows, build-macos, build-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CryPtBox-setup.exe
            dist/CryPtBox-portable.zip
            dist/CryPtBox-macos.dmg
            dist/CryPtBox-macos.zip
            dist/CryPtBox-linux-amd64.tar.gz
          generate_release_notes: true
